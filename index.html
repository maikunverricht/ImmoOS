<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4f46e5">
<title>ImmoTool</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1a1c1f; --muted:#6b7280; --line:#e3e6ea;
  --akzent:#4f46e5; --akzent-text:#ffffff; --gruen:#15803d; --rot:#b91c1c; --gelb:#a16207;
  --hover:#eef1f5; --chip:#eef2ff; --schatten:0 1px 3px rgba(0,0,0,.08);
}
[data-theme="dark"]{
  --bg:#16181d; --panel:#1f2229; --text:#e7e9ee; --muted:#9aa1ac; --line:#33363e;
  --akzent:#6366f1; --akzent-text:#ffffff; --gruen:#4ade80; --rot:#f87171; --gelb:#facc15;
  --hover:#262a33; --chip:#26304a; --schatten:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
#seitenleiste{width:215px;min-width:215px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow-y:auto}
#seitenleiste h1{font-size:17px;margin:6px 10px 12px}
#seitenleiste button.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px}
#seitenleiste button.nav:hover{background:var(--hover)}
#seitenleiste button.nav.aktiv{background:var(--chip);color:var(--akzent);font-weight:600}
#seitenleiste .sp{flex:1}
#inhalt{flex:1;overflow-y:auto;padding:18px 22px}
h2{margin:0 0 14px;font-size:20px}
h3{margin:18px 0 8px;font-size:15px}
.karte{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--schatten);margin-bottom:14px}
.kennzahlen{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kennzahl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:150px}
.kennzahl .wert{font-size:20px;font-weight:600;margin-top:2px}
.kennzahl .label{color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr.klick{cursor:pointer} tr.klick:hover td{background:var(--hover)}
tr.gewaehlt td{background:var(--chip)}
td.r,th.r{text-align:right} .gruen{color:var(--gruen)} .rot{color:var(--rot)} .gelb{color:var(--gelb)} .muted{color:var(--muted)}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:6px 13px;cursor:pointer}
button:hover{background:var(--hover)}
button.primaer{background:var(--akzent);border-color:var(--akzent);color:var(--akzent-text)}
button.primaer:hover{filter:brightness(1.08)}
button.klein{padding:2px 9px;font-size:12.5px}
button.gefahr{color:var(--rot)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--akzent);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--muted);margin:9px 0 3px}
.zeile{display:flex;gap:12px} .zeile>*{flex:1}
.werkzeuge{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.werkzeuge .sp{flex:1}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 10px;font-size:12px;margin-right:4px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;max-height:92vh;width:560px;max-width:95vw}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dkopf{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
dialog .dkoerper{padding:8px 18px 14px;overflow-y:auto;max-height:65vh}
dialog .dfuss{padding:11px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.split{display:flex;gap:14px;align-items:flex-start}
.split>.links{flex:1.1;min-width:0} .split>.rechts{flex:1;min-width:0}
.hinweis{color:var(--muted);font-size:12.5px;margin-top:6px}
.leer{color:var(--muted);text-align:center;padding:30px 0}
#statuszeile{position:fixed;bottom:0;right:0;left:215px;padding:5px 22px;font-size:12px;color:var(--muted);background:var(--bg);border-top:1px solid var(--line);display:flex;gap:18px}
#statuszeile .sp{flex:1}
.balken{height:14px;background:var(--akzent);border-radius:3px;min-width:2px;display:inline-block;vertical-align:middle}
.balken.neg{background:var(--rot)}
iframe.vorschau,img.vorschau{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px;background:#fff;object-fit:contain}
@media print{
  body>*{display:none!important}
  body{display:block;overflow:visible;background:#fff;color:#000}
  #druckbereich{display:block!important}
  #druckbereich .seite{page-break-after:always;padding:8mm 4mm;font-size:12px}
  #druckbereich table{font-size:11.5px} #druckbereich th,#druckbereich td{border-bottom:1px solid #999;padding:3px 6px}
}
#druckbereich{display:none}
.pille{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.pille.ok{background:rgba(21,128,61,.14);color:var(--gruen)}
.pille.warn{background:rgba(161,98,7,.16);color:var(--gelb)}
.pille.neutral{background:var(--chip);color:var(--akzent)}
button,.nav{transition:background .12s ease}
#bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:40;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
#bottomnav button{flex:1;border:0;background:none;border-radius:8px;padding:5px 2px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
#bottomnav button .ico{font-size:19px;line-height:1.15}
#bottomnav button.aktiv{color:var(--akzent);font-weight:600}
#fab{display:none;position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--akzent);color:#fff;border:0;font-size:26px;z-index:41;box-shadow:0 4px 14px rgba(0,0,0,.28);align-items:center;justify-content:center}
#mehrsheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:16px 16px 0 0;border-top:1px solid var(--line);z-index:50;padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:none;grid-template-columns:repeat(4,1fr);gap:10px}
#mehrsheet button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text);padding:8px 2px}
#mehrsheet button .ico{font-size:24px}
#abdunkler{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49;display:none}
@media (max-width:720px){
  #seitenleiste{display:none}
  #bottomnav{display:flex}
  #fab.sichtbar{display:flex}
  #inhalt{padding:13px 12px calc(120px + env(safe-area-inset-bottom))}
  #statuszeile{left:0;bottom:calc(56px + env(safe-area-inset-bottom));padding:4px 12px}
  h2{font-size:18px}
  .split{flex-direction:column}
  .zeile{flex-direction:column;gap:0}
  .kennzahlen{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .kennzahl{min-width:0}
  input,select,textarea{font-size:16px;min-height:42px}
  button{min-height:40px}
  button.klein{min-height:34px}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;border-left:0;border-right:0;border-bottom:0}
  dialog .dkoerper{max-height:62vh}
  #inhalt table, #inhalt tbody, dialog table, dialog tbody{display:block}
  #inhalt table tr, dialog table tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:7px 11px;background:var(--panel)}
  #inhalt table tr:has(th), dialog table tr:has(th){display:none}
  #inhalt table td, dialog table td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:3px 0;text-align:right}
  #inhalt table td[data-l]::before, dialog table td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;text-align:left;flex:0 0 40%}
  iframe.vorschau,img.vorschau{height:46vh}
}

</style>
</head>
<body>
<nav id="seitenleiste">
  <h1>🏠 ImmoTool</h1>
  <div id="navliste"></div>
  <div class="sp"></div>
  <button class="nav" onclick="themeWechseln()">🌓 Hell/Dunkel</button>
</nav>
<main id="inhalt"></main>
<div id="statuszeile"><span id="dateiinfo">Keine Datendatei</span><span class="sp"></span><span id="speicherstatus"></span></div>
<button id="fab" aria-label="Neu">＋</button>
<div id="abdunkler" onclick="mehrSchliessen()"></div>
<div id="mehrsheet"></div>
<nav id="bottomnav"></nav>
<div id="druckbereich"></div>
<script>
"use strict";
/* ============ Kern: Zustand, Speichern, Helfer ============ */
const uid = () => crypto.randomUUID();
const heute = () => new Date().toISOString().slice(0,10);

const SEED_KOSTENARTEN = (() => {
  const k = (id,bez,einnahme,umlage,betrkv,vs) => ({id,bezeichnung:bez,istEinnahme:einnahme,istUmlagefaehig:umlage,betrKvNummer:betrkv,standardVerteilerschluessel:vs});
  const VS_FLAECHE="Wohnflaeche", VS_VERBRAUCH="Verbrauch";
  const bk = (n,bez) => k("bk"+n, bez, false, true, n, (n===4||n===5||n===6)?VS_VERBRAUCH:VS_FLAECHE);
  return [
    k("miete","Mieteinnahme (Kalt)",true,false,null,VS_FLAECHE),
    k("nkvz","NK-Vorauszahlung",true,false,null,VS_FLAECHE),
    k("hzvz","Heizkosten-Vorauszahlung",true,false,null,VS_FLAECHE),
    k("inst","Instandhaltung/Reparatur",false,false,null,VS_FLAECHE),
    k("verw","Verwaltervergütung",false,false,null,VS_FLAECHE),
    k("zins","Kreditzinsen",false,false,null,VS_FLAECHE),
    k("ruecklage","Erhaltungsrücklage (Zuführung)",false,false,null,VS_FLAECHE),
    bk(1,"Laufende öffentliche Lasten (Grundsteuer)"), bk(2,"Wasserversorgung"), bk(3,"Entwässerung"),
    bk(4,"Heizung"), bk(5,"Warmwasser"), bk(6,"Verbundene Heizungs-/Warmwasseranlagen"), bk(7,"Aufzug"),
    bk(8,"Straßenreinigung und Müllbeseitigung"), bk(9,"Gebäudereinigung und Ungezieferbekämpfung"),
    bk(10,"Gartenpflege"), bk(11,"Beleuchtung (Allgemeinstrom)"), bk(12,"Schornsteinreinigung"),
    bk(13,"Sach- und Haftpflichtversicherung"), bk(14,"Hauswart"), bk(15,"Gemeinschaftsantenne/Breitbandnetz"),
    bk(16,"Einrichtungen der Wäschepflege"), bk(17,"Sonstige Betriebskosten"),
  ];
})();

function neuerZustand(){
  return { meta:{version:1, app:"ImmoTool-HTML", erstellt:new Date().toISOString()},
    kontakte:[], objekte:[], wohneinheiten:[], mietverhaeltnisse:[],
    kostenarten: JSON.parse(JSON.stringify(SEED_KOSTENARTEN)),
    buchungen:[], dokumente:[], wegs:[], nkAbrechnungen:[] };
}
let Z = neuerZustand();

/* ---- Datei-Speicherung (File System Access API + Fallback) ---- */
let dateiHandle = null, dirty = false, speicherTimer = null;

async function dateiNeu(){
  if (!window.showSaveFilePicker) return alert("Dieser Browser unterstützt das direkte Speichern nicht. Bitte Edge oder Chrome verwenden — oder über 'Exportieren' sichern.");
  try{
    dateiHandle = await showSaveFilePicker({suggestedName:"immotool-daten.json",
      types:[{description:"ImmoTool-Daten",accept:{"application/json":[".json"]}}]});
    Z = neuerZustand(); await speichern(); handleMerken(); rendern();
  }catch(e){ if(e.name!=="AbortError") alert("Fehler: "+e.message); }
}
async function dateiOeffnen(){
  if (!window.showOpenFilePicker) return dateiImportFallback();
  try{
    const [h] = await showOpenFilePicker({types:[{description:"ImmoTool-Daten",accept:{"application/json":[".json"]}}]});
    dateiHandle = h;
    handleMerken();
    const f = await h.getFile();
    ladeJson(await f.text());
  }catch(e){ if(e.name!=="AbortError") alert("Fehler beim Öffnen: "+e.message); }
}
function ladeJson(text){
  try{
    const d = JSON.parse(text);
    if (!d.meta || !Array.isArray(d.objekte)) throw new Error("Keine ImmoTool-Datendatei.");
    const basis = neuerZustand();
    Z = Object.assign(basis, d);
    if (!Z.kostenarten?.length) Z.kostenarten = basis.kostenarten;
    if (!hatDateiApi){ dirty=true; idbSpeichern(); } else { dirty=false; }
    statusZeigen(); rendern();
  }catch(e){ alert("Datei konnte nicht gelesen werden: "+e.message); }
}
async function speichern(){
  if (!dateiHandle) return;
  try{
    Z.meta.geaendert = new Date().toISOString();
    const w = await dateiHandle.createWritable();
    await w.write(JSON.stringify(Z, null, 1));
    await w.close();
    dirty=false; statusZeigen();
  }catch(e){ document.getElementById("speicherstatus").textContent = "⚠ Speichern fehlgeschlagen: "+e.message; }
}
function geaendert(){
  dirty = true; statusZeigen();
  clearTimeout(speicherTimer);
  speicherTimer = setTimeout(()=>{ dateiHandle ? speichern() : idbSpeichern(); }, 800);
}
function statusZeigen(){
  document.getElementById("dateiinfo").textContent = dateiHandle ? ("📄 "+dateiHandle.name) : (hatDateiApi ? "Keine Datendatei" : "📱 Browser-Speicher");
  document.getElementById("speicherstatus").textContent = dateiHandle ? (dirty?"Speichert …":"✓ Gespeichert")
    : hatDateiApi ? (dirty?"⚠ Ungespeichert — Datei anlegen oder exportieren!":"")
    : (dirty?"Speichert …":"✓ Im Gerät gespeichert — Backup per Export");
}
function exportieren(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(Z,null,1)],{type:"application/json"}));
  a.download = "immotool-daten.json"; a.click(); URL.revokeObjectURL(a.href);
}
function dateiImportFallback(){
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange = async () => { if(inp.files[0]) ladeJson(await inp.files[0].text()); };
  inp.click();
}
window.addEventListener("beforeunload", e => { if (dirty && !dateiHandle && hatDateiApi){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("keydown", e => { if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); dateiHandle?speichern():exportieren(); } });


/* ---- IndexedDB-Zwischenspeicher (für iPhone/iPad ohne Datei-API) ---- */
let _idb = null;
function idbOeffnen(){
  return new Promise(res => {
    try{
      const r = indexedDB.open("immotool", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("daten");
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
async function idbSpeichern(){
  if (!_idb) _idb = await idbOeffnen();
  if (!_idb) return;
  try{
    _idb.transaction("daten","readwrite").objectStore("daten").put(JSON.stringify(Z), "zustand");
    dirty = false; statusZeigen();
  }catch(e){}
}
async function idbLaden(){
  if (!_idb) _idb = await idbOeffnen();
  if (!_idb) return null;
  return new Promise(res => {
    try{
      const rq = _idb.transaction("daten").objectStore("daten").get("zustand");
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
const hatDateiApi = !!window.showSaveFilePicker;
/* ---- Datei-Handle merken (PC): beim Start wieder verbinden ---- */
let gemerkterHandle = null;
async function handleMerken(){
  if (!_idb) _idb = await idbOeffnen();
  if (!_idb || !dateiHandle) return;
  try{ _idb.transaction("daten","readwrite").objectStore("daten").put(dateiHandle, "handle"); }catch(e){}
}
async function handleLaden(){
  if (!_idb) _idb = await idbOeffnen();
  if (!_idb) return null;
  return new Promise(res => {
    try{
      const rq = _idb.transaction("daten").objectStore("daten").get("handle");
      rq.onsuccess = () => res(rq.result||null);
      rq.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
async function gemerkteVerbinden(){
  if (!gemerkterHandle) return;
  try{
    if (await gemerkterHandle.requestPermission({mode:"readwrite"}) !== "granted") return;
    dateiHandle = gemerkterHandle; gemerkterHandle = null;
    const f = await dateiHandle.getFile();
    ladeJson(await f.text());
  }catch(e){ alert("Datei konnte nicht verbunden werden: "+e.message); }
}

async function teilenOderHerunterladen(){
  const blob = new Blob([JSON.stringify(Z,null,1)], {type:"application/json"});
  const datei = new File([blob], "immotool-daten.json", {type:"application/json"});
  if (navigator.canShare && navigator.canShare({files:[datei]})){
    try{ await navigator.share({files:[datei], title:"ImmoTool-Daten"}); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  exportieren();
}

/* ---- Format-Helfer ---- */
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = cent => (cent/100).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const euroF = cent => `<span class="${cent<0?'rot':cent>0?'gruen':''}">${euro(cent)}</span>`;
function parseEuro(s){
  if (s==null || String(s).trim()==="") return null;
  s = String(s).trim().replace(/€|\s/g,"");
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g,"").replace(",",".");
  else if (/^\-?[\d.]+,?\d*$/.test(s) && s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const v = parseFloat(s);
  return isNaN(v) ? null : Math.round(v*100);
}
const datumDE = iso => iso ? new Date(iso+"T00:00").toLocaleDateString("de-DE") : "";
const monatName = (j,m) => new Date(j,m-1,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
const prozent = f => f==null ? "—" : (f*100).toLocaleString("de-DE",{maximumFractionDigits:2})+" %";

/* ---- Nachschlage-Helfer ---- */
const byId = (liste,id) => (liste||[]).find(x=>x.id===id);
const objektName = id => byId(Z.objekte,id)?.bezeichnung ?? "(unbekannt)";
const weName = id => byId(Z.wohneinheiten,id)?.bezeichnung ?? "";
const kostenartName = id => byId(Z.kostenarten,id)?.bezeichnung ?? "(ohne)";
function kontaktName(id){
  const k = byId(Z.kontakte,id); if(!k) return "";
  return k.firmenname?.trim() ? k.firmenname : [k.vorname,k.nachname].filter(Boolean).join(" ");
}
const adresseText = a => !a ? "" : [ [a.strasse,a.hausnummer].filter(Boolean).join(" "), [a.plz,a.ort].filter(Boolean).join(" ") ].filter(Boolean).join(", ");
const KONTAKT_TYPEN = ["Mieter","Versorger","Handwerker","Versicherer","WEG-Verwalter","Sonstige"];
const OBJEKT_TYPEN = ["Mehrfamilienhaus","Einfamilienhaus","Eigentumswohnung"];
const VERTEILER = [["Wohnflaeche","Wohnfläche"],["Personenzahl","Personenzahl"],["Wohneinheiten","Wohneinheiten"],["Verbrauch","Verbrauch (wie Wohnfläche*)"],["Direktzuordnung","Direktzuordnung"]];
const verteilerName = v => (VERTEILER.find(x=>x[0]===v)||["","?"])[1];

/* ---- Fachlogik: Mietverhältnis & Soll/Ist ---- */
function kaltmieteAm(mv, datumIso){
  let kalt = mv.kaltmieteCent||0;
  for (const e of [...(mv.mieterhoehungen||[])].sort((a,b)=>a.gueltigAb.localeCompare(b.gueltigAb)))
    if (e.gueltigAb <= datumIso) kalt = e.neueKaltmieteCent;
  return kalt;
}
const warmmieteAm = (mv, datumIso) => kaltmieteAm(mv, datumIso)+(mv.nkVorauszahlungCent||0)+(mv.heizkostenVorauszahlungCent||0);
const warmmiete = mv => warmmieteAm(mv, heute());
const mvAktivAm = (mv, isoVon, isoBis) => mv.mietbeginn <= isoBis && (!mv.mietende || mv.mietende >= isoVon);

function sollErzeugen(jahr, monat){
  const von = `${jahr}-${String(monat).padStart(2,"0")}-01`;
  const bis = new Date(jahr, monat, 0).toISOString().slice(0,10);
  const vorhandene = new Set(Z.buchungen.filter(b => b.istSoll && b.quelle==="SollStellung" && b.datum.startsWith(von.slice(0,7)) && b.quellenReferenzId).map(b=>b.quellenReferenzId));
  let erzeugt=0, schonDa=0;
  for (const mv of Z.mietverhaeltnisse){
    if (!mvAktivAm(mv, von, bis)) continue;
    if (vorhandene.has(mv.id)) { schonDa++; continue; }
    const we = byId(Z.wohneinheiten, mv.wohneinheitId); if(!we) continue;
    const betrag = warmmieteAm(mv, von); if(!betrag) continue;
    Z.buchungen.push({id:uid(), datum:von, objektId:we.objektId, wohneinheitId:we.id,
      kostenartId:"miete", betragCent:betrag,
      bezeichnung:`Soll Miete ${jahr}-${String(monat).padStart(2,"0")} – ${we.bezeichnung}`,
      quelle:"SollStellung", quellenReferenzId:mv.id, kontaktId:mv.mieterId, istSoll:true, istAusgleichVonId:null});
    erzeugt++;
  }
  if (erzeugt) geaendert();
  return {erzeugt, schonDa};
}
function mietStatus(jahr, monat){
  const prefix = `${jahr}-${String(monat).padStart(2,"0")}`;
  const soll = Z.buchungen.filter(b => b.istSoll && b.quelle==="SollStellung" && b.datum.startsWith(prefix));
  return soll.map(s => {
    const ist = Z.buchungen.filter(b => !b.istSoll && b.istAusgleichVonId===s.id).reduce((a,b)=>a+b.betragCent,0);
    return {sollBuchung:s, sollCent:s.betragCent, istCent:ist, offenCent:s.betragCent-ist, bezahlt:ist>=s.betragCent};
  }).sort((a,b)=> objektName(a.sollBuchung.objektId).localeCompare(objektName(b.sollBuchung.objektId)) || weName(a.sollBuchung.wohneinheitId).localeCompare(weName(b.sollBuchung.wohneinheitId)));
}
function eingangBestaetigen(sollId, betragCent){
  const s = byId(Z.buchungen, sollId); if(!s||!s.istSoll) return;
  const bereits = Z.buchungen.filter(b=>b.istAusgleichVonId===sollId&&!b.istSoll).reduce((a,b)=>a+b.betragCent,0);
  const offen = (betragCent ?? (s.betragCent-bereits));
  if (offen<=0) return;
  Z.buchungen.push({id:uid(), datum:heute(), objektId:s.objektId, wohneinheitId:s.wohneinheitId,
    kostenartId:s.kostenartId, betragCent:offen, bezeichnung:"Mieteingang (Ist) zu "+s.bezeichnung,
    quelle:"SollStellung", quellenReferenzId:s.quellenReferenzId, kontaktId:s.kontaktId, istSoll:false, istAusgleichVonId:s.id});
  geaendert();
}

function kontoimportStarten(){
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".csv,.txt";
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    let text = await inp.files[0].text();
    if (text.includes("�")) text = new TextDecoder("iso-8859-1").decode(await inp.files[0].arrayBuffer());
    const zeilen = csvParsen(text);
    if (!zeilen.length) return alert("Keine verwertbaren Zeilen gefunden. Erwartet wird eine Kopfzeile mit Datum/Betrag/Name/Verwendungszweck.");
    kontoimportDialog(zeilen);
  };
  inp.click();
}
function csvParsen(text){
  const zeilen = text.split(/\r?\n/).filter(z=>z.trim());
  if (zeilen.length<2) return [];
  const trenner = [";","\t",","].map(t=>[t,(zeilen[0].match(new RegExp(t==="\t"?"\t":"\\"+t,"g"))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const teile = z => { // einfacher CSV-Split mit Anführungszeichen
    const out=[]; let cur="", inQ=false;
    for (const c of z){ if(c==='"') inQ=!inQ; else if(c===trenner&&!inQ){out.push(cur);cur="";} else cur+=c; }
    out.push(cur); return out.map(s=>s.trim().replace(/^"|"$/g,""));
  };
  const kopf = teile(zeilen[0]).map(s=>s.toLowerCase());
  const find = (...muster) => kopf.findIndex(k => muster.some(m=>k.includes(m)));
  const iDatum = find("buchungstag","datum","valuta","date");
  const iBetrag = find("betrag","amount","umsatz");
  const iName = find("beguenstigter","begünstigter","auftraggeber","empfänger","empfaenger","name","zahlungspflichtiger");
  const iIban = find("iban","konto");
  const iZweck = find("verwendungszweck","zweck","buchungstext","beschreibung");
  if (iDatum<0 || iBetrag<0) return [];
  const erg = [];
  for (const z of zeilen.slice(1)){
    const t = teile(z); if (t.length<2) continue;
    const datum = datumParsen(t[iDatum]); const betrag = parseEuro(t[iBetrag]);
    if (!datum || betrag==null) continue;
    erg.push({datum, betragCent:betrag, name:iName>=0?t[iName]:"", iban:iIban>=0?(t[iIban]||"").replace(/\s/g,""):"", zweck:iZweck>=0?t[iZweck]:""});
  }
  return erg;
}
function datumParsen(s){
  if(!s) return null; s=s.trim();
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if (m){ const j = m[3].length===2 ? "20"+m[3] : m[3]; return `${j}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  return null;
}
function kontoVorschlaege(zeilen){
  // offene Soll-Buchungen
  const soll = Z.buchungen.filter(b=>b.istSoll && b.quelle==="SollStellung");
  const offene = soll.map(s=>{
    const ist = Z.buchungen.filter(b=>!b.istSoll&&b.istAusgleichVonId===s.id).reduce((a,b)=>a+b.betragCent,0);
    return {s, offen:s.betragCent-ist};
  }).filter(x=>x.offen>0);
  return zeilen.filter(z=>z.betragCent>0).map(z=>{
    let beste=null, score=0;
    for (const o of offene){
      let p=0;
      const betragPasst = z.betragCent===o.offen || z.betragCent===o.s.betragCent;
      if (betragPasst) p+=50; else if (Math.abs(z.betragCent-o.offen)<=100) p+=25;
      const tage = Math.abs((new Date(z.datum)-new Date(o.s.datum))/864e5);
      if (tage<=45) p+=15;
      const k = byId(Z.kontakte, o.s.kontaktId);
      if (k){
        if (z.iban && (k.bankverbindungen||[]).some(b=>(b.iban||"").replace(/\s/g,"").toLowerCase()===z.iban.toLowerCase())) p+=35;
        const nn = (k.nachname||"").toLowerCase();
        if (nn && ((z.name||"").toLowerCase().includes(nn) || (z.zweck||"").toLowerCase().includes(nn))) p+=20;
      }
      const gesamt = (betragPasst||p>=50) ? Math.min(p,100) : 0;
      if (gesamt>score){ score=gesamt; beste=o; }
    }
    return {zeile:z, sollId:beste?.s.id??null, sollText:beste?.s.bezeichnung??"", offen:beste?.offen??0,
      mieter:beste?kontaktName(beste.s.kontaktId):"", konfidenz:score, uebernehmen:score>=80};
  });
}

/* ============ Seiten: Dokumente & Inbox ============ */
const DOK_MAX = 8*1024*1024; // 8 MB je Datei (liegt als Base64 in der Datendatei!)
async function dokImport(inInbox){
  const inp = document.createElement("input"); inp.type="file"; inp.multiple=true;
  inp.onchange = async () => {
    let n=0, dup=0, zuGross=0;
    for (const f of inp.files){
      if (f.size > DOK_MAX){ zuGross++; continue; }
      const buf = await f.arrayBuffer();
      const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))].map(b=>b.toString(16).padStart(2,"0")).join("");
      if (Z.dokumente.some(d=>d.sha256===hash)){ dup++; continue; }
      const b64 = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
      Z.dokumente.push({id:uid(), dateiname:f.name, groesseBytes:f.size, sha256:hash,
        importiertAm:new Date().toISOString(), belegdatum:null, tags:"", inInbox:!!inInbox, dataUrl:b64, verknuepfungen:[]});
      n++;
    }
    geaendert(); rendern();
    if (dup||zuGross) alert(`${n} importiert, ${dup} Duplikat(e) übersprungen, ${zuGross} zu groß (> 8 MB).`);
  };
  inp.click();
}

  const istBild = /^data:image\//.test(d.dataUrl||"");

function dokVerknuepfenDialog(id){

function ruecklageDialog(wegId){
  modal("Rücklagen-Bewegung", `
    ${feld("r_datum","Datum",heute(),"date")}
    ${auswahlFeld("r_typ","Typ",[["Zufuehrung","Zuführung (aus Hausgeld)"],["Entnahme","Entnahme (z. B. Reparatur)"],["Verzinsung","Verzinsung"],["Sonstige","Sonstige"]],"Zufuehrung")}
    ${feld("r_bez","Bezeichnung")}
    ${feldG("r_betrag","Betrag (positiv eingeben)")}`,
    "Buchen", () => {
      const betrag = parseEuro(F("r_betrag"));
      if (betrag==null){ alert("Betrag angeben."); return false; }
      const w = byId(Z.wegs,wegId);
      const vz = F("r_typ")==="Entnahme" ? -1 : 1;
      (w.ruecklagen ||= []).push({id:uid(), datum:F("r_datum")||heute(), typ:F("r_typ"), bezeichnung:F("r_bez"), betragCent:Math.abs(betrag)*vz});

}
function wegRlLoeschen(wegId, rlId){
  const w = byId(Z.wegs,wegId); if(!w) return;

}
function umlagefaehigVorschlag(bez){
  const l = bez.toLowerCase();
  if (l.includes("verwalter")||l.includes("rücklage")||l.includes("rucklag")||l.includes("bankgeb")||l.includes("instandhalt")||l.includes("reparatur")) return false;
  return true;
}
function wegAbrDialog(wegId){
  const w = byId(Z.wegs,wegId);
  modal("WEG-Jahresabrechnung erfassen", `
    ${feld("a_jahr","Abrechnungsjahr",new Date().getFullYear()-1,"number")}
    ${feldG("a_saldo","Saldo der Abrechnung (+ Guthaben / − Nachzahlung)",null)}
    <label>Positionen — eine je Zeile: <code>Bezeichnung; Betrag</code></label>
    <textarea id="a_pos" rows="8" placeholder="Heizung und Warmwasser; 1.250,00&#10;Verwaltervergütung; 480,00&#10;Gebäudeversicherung; 320,50"></textarea>
    <p class="hinweis">Die Umlagefähigkeit wird automatisch vorgeschlagen (BetrKV) und ist danach per Häkchen änderbar.</p>`,
    "Anlegen", () => {
      const jahr = +F("a_jahr"); if(!jahr){ alert("Jahr angeben."); return false; }
      const positionen = F("a_pos").split("\n").map(z=>z.trim()).filter(Boolean).map((z,i)=>{
        const [bez, betrag] = z.split(";").map(s=>s?.trim());
        const cent = parseEuro(betrag);
        return cent==null ? null : {id:uid(), bezeichnung:bez, betragCent:Math.abs(cent), umlagefaehig:umlagefaehigVorschlag(bez), buchungId:null, reihenfolge:i};
      }).filter(Boolean);
      if (!positionen.length){ alert("Mindestens eine gültige Position (Bezeichnung; Betrag) angeben."); return false; }
      (w.jahresabrechnungen ||= []).push({id:uid(), jahr, hausgeldSollCent:(w.hausgeldCent||0)*12,
        saldoCent:parseEuro(F("a_saldo"))||0, status:"Entwurf", positionen});
      geaendert();
    });
}
function wegPosUmlage(wegId, abrId, posId, wert){
  const p = byId(byId(byId(Z.wegs,wegId)?.jahresabrechnungen||[],abrId)?.positionen||[],posId);
  if (p){ p.umlagefaehig = wert; geaendert(); }
}
function wegAbrBuchen(wegId, abrId){
  const w = byId(Z.wegs,wegId); const a = byId(w?.jahresabrechnungen||[],abrId);
  if (!a || a.status==="Gebucht") return;
  if (!confirm(`Für alle ${a.positionen.length} Positionen Buchungen im Jahr ${a.jahr} erzeugen?`)) return;
  const datum = `${a.jahr}-12-31`;
  for (const p of a.positionen){
    if (p.buchungId) continue;
    // Kostenart: umlagefähig → BetrKV 17 (Sonstige) als Standard, sonst Verwaltung/Instandhaltung-Heuristik
    let ka = p.umlagefaehig ? "bk17" : (p.bezeichnung.toLowerCase().includes("verwalt") ? "verw" : "inst");
    const b = {id:uid(), datum, objektId:w.objektId, wohneinheitId:null, kostenartId:ka,
      betragCent:-Math.abs(p.betragCent), bezeichnung:`WEG ${a.jahr}: ${p.bezeichnung}`,
      quelle:"Weg", quellenReferenzId:p.id, istSoll:false, istAusgleichVonId:null};
    Z.buchungen.push(b); p.buchungId = b.id;
  }
  a.status = "Gebucht"; geaendert(); rendern();
}

function nkEntwurfDialog(objektId){
  const j = new Date().getFullYear()-1;
  modal("Neue NK-Abrechnung", `
    <div class="zeile"><div>${feld("nk_von","Zeitraum von",j+"-01-01","date")}</div><div>${feld("nk_bis","Zeitraum bis",j+"-12-31","date")}</div></div>
    <p class="hinweis">Der Entwurf fasst alle umlagefähigen Ist-Buchungen des Objekts im Zeitraum nach Kostenart zusammen.</p>`,
    "Entwurf erstellen", () => {
      const von=F("nk_von"), bis=F("nk_bis");
      if(!von||!bis||von>bis){ alert("Gültigen Zeitraum angeben."); return false; }
      const buchungen = Z.buchungen.filter(b => b.objektId===objektId && !b.istSoll && b.datum>=von && b.datum<=bis
        && byId(Z.kostenarten,b.kostenartId)?.istUmlagefaehig);
      const gruppen = {};
      for (const b of buchungen) (gruppen[b.kostenartId] ||= []).push(b);
      const positionen = Object.entries(gruppen).map(([kaId,bs],i)=>{
        const ka = byId(Z.kostenarten,kaId);
        return {id:uid(), bezeichnung:ka.bezeichnung, kostenartId:kaId, betrKvNummer:ka.betrKvNummer,
          gesamtbetragCent:Math.abs(bs.reduce((x,b)=>x+b.betragCent,0)),
          verteilerschluessel:ka.standardVerteilerschluessel||"Wohnflaeche",
          reihenfolge:ka.betrKvNummer??(100+i), buchungsIds:bs.map(b=>b.id)};
      }).sort((a,b)=>a.reihenfolge-b.reihenfolge);
      const abr = {id:uid(), objektId, zeitraumVon:von, zeitraumBis:bis, status:"Entwurf",

      Z.nkAbrechnungen.push(abr); auswahl.nkAbrId = abr.id;
      geaendert();
    });
}

function monateAktiv(mv, von, bis){
  const start = new Date(Math.max(new Date(mv.mietbeginn), new Date(von)));
  const ende  = new Date(Math.min(mv.mietende?new Date(mv.mietende):new Date(bis), new Date(bis)));
  if (ende < start) return 0;
  return (ende.getFullYear()-start.getFullYear())*12 + (ende.getMonth()-start.getMonth()) + 1;
}
function nkVerteilen(abrId){
  const a = byId(Z.nkAbrechnungen,abrId); if(!a) return;
  const wes = Z.wohneinheiten.filter(w=>w.objektId===a.objektId);
  const gesamtFlaeche = wes.reduce((x,w)=>x+(w.wohnflaeche||0),0);
  // aktive MVs je Einheit + Personensumme
  const aktiveMv = {};
  for (const we of wes){
    const mv = Z.mietverhaeltnisse.filter(m=>m.wohneinheitId===we.id && mvAktivAm(m,a.zeitraumVon,a.zeitraumBis))
      .sort((x,y)=>(y.mietbeginn||"").localeCompare(x.mietbeginn||""))[0];
    if (mv) aktiveMv[we.id]=mv;
  }
  const personenSumme = Object.values(aktiveMv).reduce((x,m)=>x+(m.personenzahl||1),0);
  a.mieterAbrechnungen = [];
  for (const we of wes){
    const mv = aktiveMv[we.id]; if(!mv) continue;
    // Vorauszahlungen: explizit gebuchte VZ (nkvz/hzvz) haben Vorrang, sonst vertraglich × aktive Monate
    const gebuchteVz = Z.buchungen.filter(b=>b.objektId===a.objektId && b.wohneinheitId===we.id && !b.istSoll
      && b.datum>=a.zeitraumVon && b.datum<=a.zeitraumBis && (b.kostenartId==="nkvz"||b.kostenartId==="hzvz"))
      .reduce((x,b)=>x+b.betragCent,0);
    const vertraglich = ((mv.nkVorauszahlungCent||0)+(mv.heizkostenVorauszahlungCent||0)) * monateAktiv(mv,a.zeitraumVon,a.zeitraumBis);
    const vz = gebuchteVz>0 ? gebuchteVz : vertraglich;
    const anteile = a.positionen.map(p=>{
      let faktor;
      switch(p.verteilerschluessel){
        case "Personenzahl": faktor = personenSumme>0 ? (mv.personenzahl||1)/personenSumme : 0; break;
        case "Wohneinheiten": faktor = Object.keys(aktiveMv).length>0 ? 1/wes.length : 0; break;
        case "Direktzuordnung": faktor = 1; break;
        default: faktor = gesamtFlaeche>0 ? (we.wohnflaeche||0)/gesamtFlaeche : 0;
      }
      return {id:uid(), nkPositionId:p.id, bezeichnung:p.bezeichnung, gesamtkostenCent:p.gesamtbetragCent,
        anteilCent:Math.round(p.gesamtbetragCent*faktor), anteilsfaktor:faktor};
    });
    const gesamtanteil = anteile.reduce((x,t)=>x+t.anteilCent,0);
    a.mieterAbrechnungen.push({id:uid(), wohneinheitId:we.id, mieterId:mv.mieterId,
      mieterName:kontaktName(mv.mieterId), anteile, vorauszahlungenCent:vz, saldoCent:vz-gesamtanteil});
  }
  geaendert(); rendern();
}

async function belegLaden(){
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".pdf,image/*";
  inp.onchange = async () => {
    belegDatei = inp.files[0]; belegText = "";
    if (!belegDatei) return;
    if (belegDatei.type==="application/pdf"){
      try{ belegText = await pdfTextExtrahieren(belegDatei); }
      catch(e){ console.warn("PDF-Text nicht extrahierbar:", e); }
    }
    rendern();
  };
  inp.click();

async function pdfTextExtrahieren(datei){
  if (!window.pdfjsLib){
    await new Promise((res,rej)=>{ const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const pdf = await pdfjsLib.getDocument({data:await datei.arrayBuffer()}).promise;
  let text = "";
  for (let i=1; i<=Math.min(pdf.numPages,5); i++){
    const seite = await pdf.getPage(i);
    const inhalt = await seite.getTextContent();
    text += inhalt.items.map(x=>x.str).join(" ") + "\n";
  }
  return text;
}

async function belegBuchen(){
  if (!Z.objekte.length) return;
  const betrag = parseEuro(F("bi_betrag"));
  if (betrag==null) return alert("Betrag angeben.");
  // Dokument archivieren
  let dokId = null;
  if (belegDatei && belegDatei.size<=DOK_MAX){
    const buf = await belegDatei.arrayBuffer();
    const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))].map(b=>b.toString(16).padStart(2,"0")).join("");
    let d = Z.dokumente.find(x=>x.sha256===hash);
    if (!d){
      const b64 = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(belegDatei); });
      d = {id:uid(), dateiname:belegDatei.name, groesseBytes:belegDatei.size, sha256:hash,
        importiertAm:new Date().toISOString(), belegdatum:F("bi_datum")||null, tags:"Beleg", inInbox:false, dataUrl:b64, verknuepfungen:[]};
      Z.dokumente.push(d);
    }
    dokId = d.id;
  }
  const b = {id:uid(), datum:F("bi_datum")||heute(), objektId:F("bi_obj"), wohneinheitId:null,
    kostenartId:F("bi_ka"), betragCent:-Math.abs(betrag), bezeichnung:F("bi_bez")||belegDatei?.name||"Beleg",
    quelle:"Belegimport", istSoll:false, istAusgleichVonId:null};

  if (dokId) byId(Z.dokumente,dokId).verknuepfungen.push({id:uid(), typ:"Buchung", entitaetId:b.id, anzeige:b.bezeichnung});
  belegDatei = null; belegText = "";
  geaendert();
  alert("Buchung angelegt"+(dokId?" und Dokument archiviert.":"."));
  rendern();
}

    }).join("")}</table>`}</div>
  <div class="karte"><h3 style="margin-top:0">AfA-Tabelle (linear, §7 Abs. 4 EStG)</h3>
    ${!afa.length?'<div class="hinweis">Für die AfA-Tabelle Kaufdatum, Gebäudewert und AfA-Typ am Objekt hinterlegen.</div>':
    `<p class="hinweis">Bemessungsgrundlage: ${euro(afa[0].bmg)} (Gebäudewert + anteilige Nebenkosten; Grundanteil wird nicht abgeschrieben)</p>
    <table><tr><th>Jahr</th><th class="r">AfA</th><th class="r">Kumuliert</th><th class="r">Restbuchwert</th></tr>
    ${afa.map(z=>`<tr><td>${z.jahr}</td><td class="r">${euro(z.afaCent)}</td><td class="r">${euro(z.kumuliertCent)}</td><td class="r">${euro(z.restCent)}</td></tr>`).join("")}</table>`}</div>`;
}
function renditeBerechnen(o, jahr){
  const bs = Z.buchungen.filter(b=>b.objektId===o.id && !b.istSoll && +b.datum.slice(0,4)===jahr);
  const kalt = bs.filter(b=>b.kostenartId==="miete").reduce((x,b)=>x+b.betragCent,0);
  const ein = bs.filter(b=>b.betragCent>0).reduce((x,b)=>x+b.betragCent,0);
  const aus = bs.filter(b=>b.betragCent<0).reduce((x,b)=>x+b.betragCent,0);
  const nichtUmlage = bs.filter(b=>b.betragCent<0 && !byId(Z.kostenarten,b.kostenartId)?.istUmlagefaehig).reduce((x,b)=>x+b.betragCent,0);
  const zinsen = bs.filter(b=>b.kostenartId==="zins").reduce((x,b)=>x+b.betragCent,0);
  const cashflow = ein+aus;
  const kp = o.kaufpreisGesamtCent, nk = o.kaufnebenkostenCent||0;
  const ek = kp!=null ? kp+nk-(o.darlehensbetragCent||0) : null;
  const bmg = afaBmg(o);
  return {
    brutto: kp>0 ? kalt/kp : null,
    netto: kp>0 ? (kalt+nichtUmlage)/(kp+nk) : null,
    ek: ek>0 ? cashflow/ek : null,
    cashflowCent: cashflow,
    afaJahrCent: (bmg && o.afaTyp) ? Math.round(bmg*(o.afaTyp==="Neubau3Prozent"?0.03:0.02)) : 0,
  };
}
function afaBmg(o){
  const geb = o.kaufpreisGebaeudeCent||0;
  if (!geb) return 0;
  const gesamt = geb + (o.kaufpreisGrundCent||0);
  const anteil = gesamt>0 ? geb/gesamt : 1;
  return geb + Math.round((o.kaufnebenkostenCent||0)*anteil);
}
function afaTabelle(o){
  const bmg = afaBmg(o);
  if (!bmg || !o.afaTyp || !o.kaufdatum) return [];
  const satz = o.afaTyp==="Neubau3Prozent"?0.03:0.02;
  const jahresAfa = Math.round(bmg*satz);
  const start = +o.kaufdatum.slice(0,4);
  const zeilen = []; let kum = 0;
  for (let i=0; i<60; i++){
    const afa = Math.min(jahresAfa, Math.max(0,bmg-kum));
    kum += afa;
    zeilen.push({jahr:start+i, afaCent:afa, kumuliertCent:kum, restCent:Math.max(0,bmg-kum), bmg});
    if (kum>=bmg) break;
  }
  return zeilen;
}

  `<table><tr><th>Objekt</th><th class="r">Einnahmen</th><th class="r">Ausgaben</th><th class="r">Cashflow</th></tr>
  ${zeilen.map(z=>`<tr><td><b>${esc(z.name)}</b></td><td class="r">${euro(z.ein)}</td><td class="r">${euro(z.aus)}</td><td class="r"><b>${euroF(z.ein+z.aus)}</b></td></tr>`).join("")}
  <tr><td><b>Gesamt</b></td><td class="r"><b>${euro(sumEin)}</b></td><td class="r"><b>${euro(sumAus)}</b></td><td class="r"><b>${euroF(sumEin+sumAus)}</b></td></tr></table>`}</div>`;
}

/* ============ Seite: Daten & Einstellungen ============ */

  const n = l => (l||[]).length;
  return `<h2>Daten &amp; Einstellungen</h2>

    <p>${dateiHandle?("Aktuelle Datei: <b>"+esc(dateiHandle.name)+"</b> — Änderungen werden automatisch gespeichert.")
    :hatDateiApi?'<span class="gelb">⚠ Keine Datendatei verbunden — Daten gehen beim Schließen verloren!</span>'
    :'Änderungen werden automatisch im Gerätespeicher dieses Browsers gesichert.'}</p>
    <div class="werkzeuge">
      ${hatDateiApi?`<button class="primaer" onclick="dateiNeu()">Neue Datendatei anlegen …</button>
      <button onclick="dateiOeffnen()">Datendatei öffnen …</button>
      <button onclick="exportieren()">Exportieren (Download)</button>
      <button onclick="dateiImportFallback()">Importieren (Datei wählen)</button>`
      :`<button class="primaer" onclick="dateiImportFallback()">Aus iCloud/Dateien öffnen …</button>
      <button onclick="teilenOderHerunterladen()">Nach iCloud exportieren (Teilen) …</button>`}
    </div>
    <p class="hinweis">${hatDateiApi?"Empfehlung: Die Datendatei im iCloud-Drive- oder OneDrive-Ordner anlegen — dann ist das Backup automatisch. Speichern jederzeit mit Strg+S."
    :"Auf dem iPhone/iPad: Änderungen werden automatisch im Gerät gespeichert. Zum Abgleich mit dem PC die Datei über „Aus iCloud öffnen“ laden und nach getaner Arbeit über „Nach iCloud exportieren“ → „In Dateien sichern“ zurücklegen."}</p></div>
  <div class="karte"><h3 style="margin-top:0">Bestand</h3>
    <p>${n(Z.objekte)} Objekte · ${n(Z.wohneinheiten)} Wohneinheiten · ${n(Z.mietverhaeltnisse)} Mietverhältnisse · ${n(Z.kontakte)} Kontakte ·
    ${n(Z.buchungen)} Buchungen · ${n(Z.dokumente)} Dokumente · ${n(Z.wegs)} WEG · ${n(Z.nkAbrechnungen)} NK-Abrechnungen</p></div>
  <div class="karte"><h3 style="margin-top:0">Kostenarten</h3>
    <table><tr><th>Bezeichnung</th><th>Art</th><th>Umlagefähig</th><th>BetrKV</th><th>Standard-Schlüssel</th></tr>
    ${Z.kostenarten.map(k=>`<tr><td>${esc(k.bezeichnung)}</td><td>${k.istEinnahme?"Einnahme":"Ausgabe"}</td>
    <td>${k.istUmlagefaehig?"✓":"—"}</td><td>${k.betrKvNummer??"—"}</td><td>${k.istUmlagefaehig?verteilerName(k.standardVerteilerschluessel):"—"}</td></tr>`).join("")}</table></div>`;
}

/* ============ Start ============ */
try{ const t = localStorage.getItem("immotool-theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
(async () => {
  if (!hatDateiApi){
    const gespeichert = await idbLaden();
    if (gespeichert){ try{ Z = Object.assign(neuerZustand(), JSON.parse(gespeichert)); }catch(e){} }
  } else {
    const h = await handleLaden();
    if (h){
      try{
        if (await h.queryPermission({mode:"readwrite"}) === "granted"){
          dateiHandle = h;
          const f = await h.getFile();
          Z = Object.assign(neuerZustand(), JSON.parse(await f.text()));
        } else {
          gemerkterHandle = h;
        }
      }catch(e){ gemerkterHandle = null; }
    }
  }
  rendern();
})();
</script>
